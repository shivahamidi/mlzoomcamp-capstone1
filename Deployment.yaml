apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-ml-service
  labels:
    app: my-ml-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-ml-service
  template:
    metadata:
      labels:
        app: my-ml-service
    spec:
      containers:
      - name: my-ml-service
        image: your-dockerhub-username/my-ml-service:latest
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /predict
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
